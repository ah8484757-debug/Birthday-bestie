<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Happy Birthday Bestie ❤️</title>
<style>
body{margin:0;font-family:Arial;text-align:center;background:linear-gradient(135deg,#ff9a9e,#fad0c4);color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden}
.card{background:rgba(255,255,255,.18);padding:35px 22px;border-radius:30px;max-width:360px;box-shadow:0 10px 35px #0003}
h1{font-size:38px;margin:10px 0}
p{font-size:19px;line-height:1.6}
button{border:0;border-radius:30px;padding:15px 28px;font-size:18px;background:white;color:#ff5f7e}
.heart{font-size:55px;animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.2)}}
.confetti{position:fixed;top:-20px;font-size:25px;animation:fall 4s linear infinite}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
</style>
</head>
<body>
<div class="card">
<div class="heart">❤️</div>
<h1>Happy Birthday! 🎂</h1>
<p>Happy Birthday, my bestie! ❤️🎂<br>
May Allah always keep you happy and smiling. You deserve all the happiness in the world! 🫶🏻✨<br>
Stay crazy, stay amazing! 😂❤️</p>
<button onclick="celebrate()">Tap for a Surprise 🎁</button>
</div>
<script>
function celebrate(){
alert("Happy Birthday to You! 🎉🎂❤️");
for(let i=0;i<30;i++){
let x=document.createElement("div");
x.className="confetti";
x.innerHTML=["🎈","🎉","✨","❤️","🎂"][Math.floor(Math.random()*5)];
x.style.left=Math.random()*100+"vw";
x.style.animationDelay=Math.random()*2+"s";
document.body.appendChild(x);
}
}
</script>
</body>
</html>
